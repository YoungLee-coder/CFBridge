name = "cfbridge"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Meta D1 — bind in Cloudflare Dashboard after deploy (no database_id in this file):
#   Workers & Pages → cfbridge → Settings → Bindings → Add → D1 database
#   Variable name: META
#   Database: create or select "cfbridge-meta"
# Then open the Worker URL → Setup → Initialize schema.
#
# Keep [[d1_databases]] out of this file so Dashboard bindings are not overwritten
# by wrangler/Git deploy. Local `wrangler dev` / `db:migrate:local` use wrangler.dev.toml.

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/admin/*",
  "/v1/*",
  "/health",
  "/health/*",
  "/docs/api.md",
  "/llms.txt",
  "/llms-full.txt",
]

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[dev]
port = 8787
