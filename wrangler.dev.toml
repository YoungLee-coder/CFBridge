# Local wrangler config — use with: wrangler -c wrangler.dev.toml …
# Production deploy uses wrangler.toml (no Meta D1 / DATA_KV ids).

name = "cfbridge"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "META"
database_name = "cfbridge-meta"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "DATA_KV"
id = "00000000-0000-0000-0000-000000000002"
preview_id = "00000000-0000-0000-0000-000000000002"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/admin/*",
  "/v1/*",
  "/health",
  "/health/*",
  "/docs/api.md",
  "/llms.txt",
  "/llms-full.txt",
]

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[dev]
port = 8787
